name: Apply Anatomica v0.4.1 Confidence Remediation Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v041-confidence-remediation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python scripts/patch_v041_confidence_remediation.py

      - name: Remove one-time migration files
        run: |
          rm scripts/patch_v041_confidence_remediation.py
          rm .github/workflows/patch-v041-confidence-remediation.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add confidence-aware remediation workflow"
          git push
