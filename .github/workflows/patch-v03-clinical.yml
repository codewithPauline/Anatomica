name: Apply Anatomica v0.3 Clinical Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v03-clinical.yml'
      - 'scripts/patch_v03_clinical.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch_v03_clinical.py

      - name: Remove one-time migration files
        run: |
          git rm .github/workflows/patch-v03-clinical.yml
          git rm scripts/patch_v03_clinical.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css package.json
          git commit -m "feat: launch v0.3 clinical case explorer"
          git pull --rebase origin main
          git push origin HEAD:main
