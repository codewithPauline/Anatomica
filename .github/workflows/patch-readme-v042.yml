name: Apply Anatomica v0.4.2 README Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply README patch
        run: python scripts/migrate_readme_v042.py

      - name: Remove one-time migration files
        run: |
          rm scripts/migrate_readme_v042.py
          rm .github/workflows/patch-readme-v042.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document v0.4.2 error-pattern intelligence" || exit 0
          git push
