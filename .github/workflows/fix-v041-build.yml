name: Fix Anatomica v0.4.1 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v041-build.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply syntax fix
        run: python scripts/fix_v041_build.py

      - name: Remove one-time fix files
        run: |
          rm scripts/fix_v041_build.py
          rm .github/workflows/fix-v041-build.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair v0.4.1 dashboard fallback string"
          git push
