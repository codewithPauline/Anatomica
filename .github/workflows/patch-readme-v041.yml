name: Apply Anatomica v0.4.1 README Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-readme-v041.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply README patch
        run: python scripts/patch_readme_v041.py

      - name: Remove one-time migration files
        run: |
          rm scripts/patch_readme_v041.py
          rm .github/workflows/patch-readme-v041.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document v0.4.1 confidence-aware remediation"
          git push
