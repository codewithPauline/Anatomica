name: Apply Anatomica v0.3.9 Challenge Variant Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v039-challenge-variants.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python scripts/migrate_v039_challenge_variants.py

      - name: Remove one-time migration files
        run: |
          rm scripts/migrate_v039_challenge_variants.py
          rm .github/workflows/patch-v039-challenge-variants.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add stable alternate challenge vignettes"
          git push
