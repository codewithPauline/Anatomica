name: Apply Anatomica v0.3.1 Nerve Deficit Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v031-nerve-deficits.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch_v03_nerve_deficits.py

      - name: Remove one-time migration files
        run: git rm .github/workflows/patch-v031-nerve-deficits.yml scripts/patch_v03_nerve_deficits.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css package.json .github/workflows/patch-v031-nerve-deficits.yml scripts/patch_v03_nerve_deficits.py
          git commit -m "feat: add nerve deficit explorer"
          git pull --rebase origin main
          git push origin HEAD:main
