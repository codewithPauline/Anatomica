name: Build BodyParts3D Upper-Limb Assets

on:
  push:
    paths:
      - '.github/workflows/build-anatomy-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install converters
        run: pip install trimesh numpy

      - name: Download official BodyParts3D mesh archive
        run: |
          curl -L --fail --retry 3 \
            'https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/isa_BP3D_4.0_obj_99.zip' \
            -o /tmp/bodyparts3d.zip
          mkdir -p /tmp/bodyparts3d
          unzip -q /tmp/bodyparts3d.zip -d /tmp/bodyparts3d

      - name: Convert upper-limb structures to GLB
        run: |
          mkdir -p public/models/upper-limb
          python - <<'PY'
          from pathlib import Path
          import trimesh

          root = Path('/tmp/bodyparts3d')
          output = Path('public/models/upper-limb')

          assets = {
              'humerus.glb': ['FJ3368.obj'],
              'radius.glb': ['FJ3349.obj'],
              'ulna.glb': ['FJ3391.obj'],
              'biceps-brachii.glb': ['FJ1512.obj', 'FJ1478.obj'],
              'triceps-brachii.glb': ['FJ1480.obj', 'FJ1477.obj', 'FJ1479.obj'],
          }

          def locate(name):
              matches = list(root.rglob(name))
              if not matches:
                  raise FileNotFoundError(f'Could not find atomic BodyParts3D mesh {name}')
              return matches[0]

          for target_name, source_names in assets.items():
              scene = trimesh.Scene()
              for source_name in source_names:
                  source = locate(source_name)
                  loaded = trimesh.load(source, force='scene', process=False)
                  if isinstance(loaded, trimesh.Trimesh):
                      scene.add_geometry(loaded, node_name=source.stem, geom_name=source.stem)
                  else:
                      for geom_name, geometry in loaded.geometry.items():
                          scene.add_geometry(
                              geometry.copy(),
                              node_name=f'{source.stem}_{geom_name}',
                              geom_name=f'{source.stem}_{geom_name}',
                          )

              data = scene.export(file_type='glb')
              target = output / target_name
              target.write_bytes(data)
              print(f"{', '.join(source_names)} -> {target} ({target.stat().st_size:,} bytes)")
          PY

      - name: Commit generated GLBs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/upper-limb/*.glb
          if git diff --cached --quiet; then
            echo 'No new asset changes to commit.'
          else
            git commit -m 'assets: add BodyParts3D upper-arm muscle GLBs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
