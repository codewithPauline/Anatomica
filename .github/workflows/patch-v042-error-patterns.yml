name: Apply Anatomica v0.4.2 Error Pattern Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/migrate_v042_error_patterns.py

      - name: Remove one-time migration files
        run: |
          rm scripts/migrate_v042_error_patterns.py
          rm .github/workflows/patch-v042-error-patterns.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add error-pattern intelligence" || exit 0
          git push
