name: Apply Anatomica v0.4.0 Confidence Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v040-confidence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python scripts/migrate_v040_confidence.py

      - name: Remove one-time migration files
        run: |
          rm scripts/migrate_v040_confidence.py
          rm .github/workflows/patch-v040-confidence.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add confidence-calibrated clinical reasoning"
          git push
