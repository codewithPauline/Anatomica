name: Apply Anatomica v0.3.5 README Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-readme-v035.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply README patch
        run: python scripts/patch_readme_v035.py

      - name: Remove one-time migration files
        run: git rm .github/workflows/patch-readme-v035.yml scripts/patch_readme_v035.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: describe adaptive localization sessions"
          git pull --rebase origin main
          git push origin HEAD:main
