name: Apply Anatomica v0.3.4 Localization Challenge Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v034-localization-challenges.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch_v034_localization_challenges.py

      - name: Remove one-time migration files
        run: git rm .github/workflows/patch-v034-localization-challenges.yml scripts/patch_v034_localization_challenges.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add clinical localization challenge mode"
          git pull --rebase origin main
          git push origin HEAD:main
