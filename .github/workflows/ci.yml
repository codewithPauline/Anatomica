name: Anatomica CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate clinical content
        run: npm run validate:clinical

      - name: Validate learner progress store
        run: npm run validate:progress

      - name: Validate mastery dashboard
        run: npm run validate:mastery

      - name: Validate targeted remediation
        run: npm run validate:remediation

      - name: Validate challenge variants
        run: npm run validate:variants

      - name: Build
        run: npm run build
